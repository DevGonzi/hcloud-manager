name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: dist/*.exe
            name: win
          - os: macos-latest
            artifact: dist/*.dmg
            name: mac
          - os: ubuntu-latest
            artifact: dist/*.AppImage
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: Remove-Item -ErrorAction SilentlyContinue package-lock.json; npm install
        shell: pwsh

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build:${{ matrix.name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hcloud-manager-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

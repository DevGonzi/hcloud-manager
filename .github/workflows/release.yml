name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: dist/*.exe
            name: win
          - os: macos-latest
            artifact: dist/*.{dmg,zip}
            name: mac
          - os: ubuntu-latest
            artifact: dist/*.AppImage
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: Remove-Item -ErrorAction SilentlyContinue package-lock.json; npm install
        shell: pwsh

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build:${{ matrix.name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

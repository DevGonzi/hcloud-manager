version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"
    groups:
      electron:
        patterns:
          - electron
          - electron-*
          - "@electron-toolkit/*"
        update-types:
          - "minor"
          - "patch"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      vite:
        patterns:
          - vite
          - "@vitejs/*"
          - electron-vite
        update-types:
          - "minor"
          - "patch"
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
        update-types:
          - "minor"
          - "patch"

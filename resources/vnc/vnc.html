<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Console</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0c0d10; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif; color: #e2e6f0; }
    #status {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      z-index: 10; background: #0c0d10;
    }
    #status.hidden { display: none; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #252a38;
      border-top-color: #d50c2d;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status p { color: #8892a8; font-size: 13px; }
    #status.error p { color: #d50c2d; }
    #vnc-canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="status">
    <div class="spinner"></div>
    <p id="status-text">Verbinde mit Server...</p>
  </div>
  <canvas id="vnc-canvas"></canvas>

  <script type="module">
    const params = new URLSearchParams(window.location.search)
    const wssUrl = params.get('wss_url')
    const password = params.get('password')

    const statusEl = document.getElementById('status')
    const statusText = document.getElementById('status-text')

    function showError(msg) {
      statusEl.classList.add('error')
      statusEl.querySelector('.spinner').style.display = 'none'
      statusText.textContent = msg
    }

    if (!wssUrl || !password) {
      showError('Fehlende Verbindungsparameter.')
    } else {
      import('./novnc/rfb.js').then(({ default: RFB }) => {
        const rfb = new RFB(document.getElementById('vnc-canvas'), wssUrl, {
          credentials: { password },
        })

        rfb.scaleViewport = true
        rfb.resizeSession = true

        rfb.addEventListener('connect', () => {
          statusEl.classList.add('hidden')
        })

        rfb.addEventListener('disconnect', (e) => {
          statusEl.classList.remove('hidden', 'error')
          statusEl.querySelector('.spinner').style.display = 'none'
          statusText.textContent = e.detail.clean ? 'Verbindung getrennt.' : 'Verbindung unterbrochen.'
        })

        rfb.addEventListener('credentialsrequired', () => {
          rfb.sendCredentials({ password })
        })

        rfb.addEventListener('securityfailure', () => {
          showError('Authentifizierung fehlgeschlagen.')
        })
      }).catch(err => {
        showError('noVNC konnte nicht geladen werden: ' + err.message)
      })
    }
  </script>
</body>
</html>
